name: Collect offers from pub websites

# Proof of concept, run by hand. Visits London pubs' own websites (respecting robots.txt)
# and saves the text around offers to the scrape-data branch, to be read and checked
# before anything is shown on the site. Needs SUPABASE_ACCESS_TOKEN.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: How many pubs to visit
        default: '2000'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: yhttayboxljswczexspg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node supabase/seed/scrape-offers.mjs "$RUNNER_TEMP/offer-pages.jsonl" "${{ inputs.limit }}"
      - name: Save to the scrape-data branch
        run: |
          cd "$RUNNER_TEMP" && mkdir data && cd data && git init -q -b scrape-data
          cp ../offer-pages.jsonl .
          git -c user.name=ratemyguin-bot -c user.email=bot@ratemyguin.com commit -qam "offer pages $(date -u +%F)" || (git add . && git -c user.name=ratemyguin-bot -c user.email=bot@ratemyguin.com commit -qm "offer pages $(date -u +%F)")
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" scrape-data

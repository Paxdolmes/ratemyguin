name: Deploy web app

# Publishes the drinkers app as the website on ratemyguin.com (Cloudflare Pages), using the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets. Also keeps the Expo Hosting copy
# at ratemyguin.expo.app (EXPO_TOKEN secret).

on:
  push:
    branches: [main, expo-test-build] # expo-test-build is temporary, for trying it before merging
    paths: ['mobile/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

concurrency: deploy-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: https://yhttayboxljswczexspg.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_8aeFY-i4xdQPbQ7kA_BRjA_WfoJR18a
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx expo export --platform web
      - name: Publish
        if: env.EXPO_TOKEN != ''
        run: npx --yes eas-cli@latest deploy --prod --non-interactive --alias ratemyguin 2>&1 | tee deploy.log || npx --yes eas-cli@latest deploy --prod --non-interactive 2>&1 | tee deploy.log
      - name: Publish on ratemyguin.com
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx --yes wrangler@3 pages project create ratemyguin --production-branch main 2>&1 | tail -2 || true
          npx --yes wrangler@3 pages deploy dist --project-name ratemyguin --branch main --commit-dirty=true 2>&1 | tail -4
          api=https://api.cloudflare.com/client/v4
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          for d in ratemyguin.com www.ratemyguin.com; do
            curl -sS -X POST "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/ratemyguin/domains" -d "{\"name\":\"$d\"}" | jq -c '{success, errors: [.errors[]?.message], status: .result.status}'
          done
          zone=$(curl -sS "${auth[@]}" "$api/zones?name=ratemyguin.com" | jq -r '.result[0].id // empty')
          if [ -z "$zone" ]; then echo "::warning::Couldn't see the ratemyguin.com zone; add CNAME records to ratemyguin.pages.dev by hand."; exit 0; fi
          for n in ratemyguin.com www; do
            existing=$(curl -sS "${auth[@]}" "$api/zones/$zone/dns_records?type=CNAME&name=$( [ $n = www ] && echo www.ratemyguin.com || echo ratemyguin.com )" | jq -r '.result[0].id // empty')
            if [ -z "$existing" ]; then
              curl -sS -X POST "${auth[@]}" "$api/zones/$zone/dns_records" -d "{\"type\":\"CNAME\",\"name\":\"$n\",\"content\":\"ratemyguin.pages.dev\",\"proxied\":true}" | jq -c '{success, errors: [.errors[]?.message]}'
            fi
          done
          for d in ratemyguin.com www.ratemyguin.com; do
            curl -sS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/ratemyguin/domains/$d" | jq -c '{domain: .result.name, status: .result.status, validation: .result.validation_data.status}'
          done
      - name: Screenshot the live site
        working-directory: .
        run: |
          npm i --no-save --prefix /tmp/shots playwright@1 >/dev/null 2>&1
          npx --prefix /tmp/shots playwright install --with-deps chromium >/dev/null 2>&1
          cat > /tmp/shots/shot.cjs <<'JS'
          const { chromium } = require('/tmp/shots/node_modules/playwright');
          (async () => {
            const b = await chromium.launch();
            const sizes = { phone: { width: 390, height: 844 }, desktop: { width: 1440, height: 900 } };
            for (const [name, viewport] of Object.entries(sizes)) {
              const ctx = await b.newContext({ viewport, deviceScaleFactor: 1, geolocation: { latitude: 51.4787, longitude: -0.1957 }, permissions: ['geolocation'] });
              const p = await ctx.newPage();
              for (const path of ['/', '/leaderboards', '/passport']) {
                await p.goto('https://ratemyguin.expo.app' + path, { waitUntil: 'networkidle' });
                await p.waitForTimeout(4000);
                await p.screenshot({ path: `shots/${name}${path.replace(/\//g, '_')}.png`, fullPage: true });
              }
              await ctx.close();
            }
            await b.close();
          })();
          JS
          mkdir -p shots && node /tmp/shots/shot.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/

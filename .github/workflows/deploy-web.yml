name: Deploy web app

# Publishes the drinkers app as a website on Expo Hosting (EAS). Needs the EXPO_TOKEN secret.

on:
  push:
    branches: [main, expo-test-build] # expo-test-build is temporary, for trying it before merging
    paths: ['mobile/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

concurrency: deploy-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: https://yhttayboxljswczexspg.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_8aeFY-i4xdQPbQ7kA_BRjA_WfoJR18a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx expo export --platform web
      - name: Publish
        run: npx --yes eas-cli@latest deploy --prod --non-interactive --alias ratemyguin 2>&1 | tee deploy.log || npx --yes eas-cli@latest deploy --prod --non-interactive 2>&1 | tee deploy.log
      - name: Screenshot the live site
        working-directory: .
        run: |
          npm i --no-save --prefix /tmp/shots playwright@1 >/dev/null 2>&1
          npx --prefix /tmp/shots playwright install --with-deps chromium >/dev/null 2>&1
          cat > /tmp/shots/shot.cjs <<'JS'
          const { chromium } = require('/tmp/shots/node_modules/playwright');
          (async () => {
            const b = await chromium.launch();
            const sizes = { phone: { width: 390, height: 844 }, desktop: { width: 1440, height: 900 } };
            for (const [name, viewport] of Object.entries(sizes)) {
              const ctx = await b.newContext({ viewport, deviceScaleFactor: 1, geolocation: { latitude: 51.4787, longitude: -0.1957 }, permissions: ['geolocation'] });
              const p = await ctx.newPage();
              for (const path of ['/', '/leaderboards', '/passport']) {
                await p.goto('https://ratemyguin.expo.app' + path, { waitUntil: 'networkidle' });
                await p.waitForTimeout(4000);
                await p.screenshot({ path: `shots/${name}${path.replace(/\//g, '_')}.png`, fullPage: true });
              }
              await ctx.close();
            }
            await b.close();
          })();
          JS
          mkdir -p shots && node /tmp/shots/shot.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/

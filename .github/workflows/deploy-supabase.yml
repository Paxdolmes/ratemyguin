name: Deploy Supabase

# Applies new database migrations to the live Supabase project whenever main changes.
# Needs two repository secrets: SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD.

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

concurrency: deploy-supabase

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: yhttayboxljswczexspg
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD as repository secrets to deploy."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Apply the sign-in code email
        # Supabase only allows custom emails once a custom SMTP sender is set up,
        # so don't fail the database deploy over it.
        continue-on-error: true
        run: |
          body=$(jq -n --rawfile html supabase/templates/sign-in-code.html '{
            mailer_subjects_magic_link: "{{ .Token }} is your RateMyGuin sign-in code",
            mailer_templates_magic_link_content: $html,
            mailer_subjects_confirmation: "{{ .Token }} is your RateMyGuin sign-in code",
            mailer_templates_confirmation_content: $html
          }')
          status=$(curl -sS -o response.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$body")
          if [ "$status" -ge 300 ]; then
            echo "::warning::Sign-in email not updated ($status): $(cat response.json)"
            exit 1
          fi

name: Deploy Supabase

# Applies new database migrations to the live Supabase project whenever main changes.
# Needs two repository secrets: SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD.
# Optional: RESEND_API_KEY secret makes Supabase send sign-in codes through Resend.
# EMAIL_FROM repository variable overrides the sender (default codes@mail.ratemyguin.com,
# verified in Resend).

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:
    inputs:
      test_email:
        description: Optional. Send a sign-in code to this address after deploying, to check email works.
        required: false

concurrency: deploy-supabase

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: yhttayboxljswczexspg
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM || 'codes@mail.ratemyguin.com' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD as repository secrets to deploy."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Send sign-in emails through Resend
        if: env.RESEND_API_KEY != ''
        run: |
          body=$(jq -n --arg pass "$RESEND_API_KEY" --arg from "$EMAIL_FROM" '{
            external_email_enabled: true,
            smtp_host: "smtp.resend.com",
            smtp_port: "465",
            smtp_user: "resend",
            smtp_pass: $pass,
            smtp_admin_email: $from,
            smtp_sender_name: "RateMyGuin",
            rate_limit_email_sent: 60
          }')
          status=$(curl -sS -o response.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$body")
          if [ "$status" -ge 300 ]; then
            echo "::error::Resend SMTP not applied ($status): $(cat response.json)"
            exit 1
          fi
          echo "Supabase now sends email from $EMAIL_FROM via Resend"
      - name: Use the verified sender address
        run: |
          body=$(jq -n --arg from "$EMAIL_FROM" '{smtp_admin_email: $from, smtp_sender_name: "RateMyGuin"}')
          status=$(curl -sS -o response.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$body")
          if [ "$status" -ge 300 ]; then echo "::warning::Sender not updated ($status): $(cat response.json)"; fi
      - name: Apply the sign-in code email
        # Supabase only allows custom emails once a custom SMTP sender is set up,
        # so don't fail the database deploy over it.
        continue-on-error: true
        run: |
          body=$(jq -n --rawfile html supabase/templates/sign-in-code.html '{
            mailer_subjects_magic_link: "{{ .Token }} is your RateMyGuin sign-in code",
            mailer_templates_magic_link_content: $html,
            mailer_subjects_confirmation: "{{ .Token }} is your RateMyGuin sign-in code",
            mailer_templates_confirmation_content: $html
          }')
          status=$(curl -sS -o response.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$body")
          if [ "$status" -ge 300 ]; then
            echo "::warning::Sign-in email not updated ($status): $(cat response.json)"
            exit 1
          fi
      - name: Show the saved email settings
        run: |
          curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq '{smtp_host, smtp_admin_email, external_email_enabled, mailer_otp_length, mailer_otp_exp, mailer_subjects_magic_link, magic_link_template_chars: (.mailer_templates_magic_link_content|length), magic_link_has_token: (.mailer_templates_magic_link_content|tostring|contains(".Token")), mailer_subjects_confirmation, confirmation_has_token: (.mailer_templates_confirmation_content|tostring|contains(".Token"))}'
      - name: Send a test sign-in code
        if: inputs.test_email != ''
        env:
          EMAIL: ${{ inputs.test_email }}
          KEY: sb_publishable_8aeFY-i4xdQPbQ7kA_BRjA_WfoJR18a
        run: |
          sleep 90 # auth settings take about a minute to go live after a change
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST "https://$PROJECT_REF.supabase.co/auth/v1/otp" \
            -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d "$(jq -n --arg e "$EMAIL" '{email: $e, create_user: true}')")
          if [ "$status" -ge 300 ]; then echo "::error::Supabase refused to send the code ($status): $(cat response.json)"; exit 1; fi
          echo "Test code sent"
